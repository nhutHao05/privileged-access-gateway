{% if r.status == "pending" and is_admin %}
<button class="btn-small btn-approve"
        style="border:none; cursor:pointer;"
        hx-get="/access-requests/{{ r.id }}/assign-panel"
        hx-target="#request-actions-{{ r.id }}"
        hx-swap="innerHTML">
    Phân quyền
</button>
<button class="btn-small btn-reject"
        hx-post="/access-requests/{{ r.id }}/reject"
        hx-target="#requests-table-wrapper"
        hx-swap="innerHTML">
    Từ chối
</button>
{% elif r.status == "pending" %}
<span class="badge badge-pending">Chờ duyệt (chỉ Admin/Support)</span>
{% endif %}
