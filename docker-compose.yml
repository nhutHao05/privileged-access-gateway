version: '3.8'

services:
  # ==========================================
  # 1. Reverse Proxy (TLS Termination)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: pam_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - guacamole
      - keycloak
      - control-plane-backend
    networks:
      - pam_frontend
      - pam_backend

  # ==========================================
  # 2. Keycloak (OIDC Provider + Native OTP)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: pam_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: pam_user
      KC_DB_PASSWORD: pam_password
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge
    volumes:
      - ./keycloak/pam-realm.json:/opt/keycloak/data/import/pam-realm.json:ro
    depends_on:
      - postgres
    networks:
      - pam_backend

  # ==========================================
  # 3. Apache Guacamole Web App & guacd Daemon
  # ==========================================
  guacd:
    image: guacamole/guacd:1.5.4
    container_name: pam_guacd
    volumes:
      - ./recordings:/var/lib/guacamole/recordings
    networks:
      - pam_backend
      - pam_targets

  guacamole:
    image: guacamole/guacamole:1.5.4
    container_name: pam_guacamole
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: guacamole
      POSTGRES_USER: pam_user
      POSTGRES_PASSWORD: pam_password
      JAVA_OPTS: "-XX:-UseContainerSupport"
    depends_on:
      - guacd
      - postgres
    networks:
      - pam_backend

  # ==========================================
  # 4. Control Plane Backend (FastAPI - Inh)
  # ==========================================
  control-plane-backend:
    build:
      context: ./control-plane-backend
      dockerfile: Dockerfile
    container_name: pam_control_backend
    ports:
      - "8000:8000"
    env_file:
      - ./control-plane-backend/.env.docker
    depends_on:
      - postgres
      - guacamole
      - keycloak
    networks:
      - pam_backend
      - pam_frontend

  # ==========================================
  # 5. Database (Shared Postgres for KC, Guac & Control Plane)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: pam_postgres
    environment:
      POSTGRES_USER: pam_user
      POSTGRES_PASSWORD: pam_password
      POSTGRES_MULTIPLE_DATABASES: keycloak,guacamole,pam_control
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - pam_backend

  # ==========================================
  # 6. Target Servers (For Testing SSH & VNC)
  # ==========================================
  target_linux_ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: target_linux_ssh
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Ho_Chi_Minh
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: "secret_ssh_password"
      USER_NAME: "ubuntu"
    networks:
      - pam_targets

  target_vnc:
    image: lscr.io/linuxserver/chromium:latest
    container_name: target_vnc
    environment:
      CUSTOM_USER: "vncuser"
      PASSWORD: "secret_vnc_password"
    networks:
      - pam_targets

  # ==========================================
  # 7. Audit & Storage (MinIO & Worker - Sang)
  # ==========================================
  minio:
    image: minio/minio
    container_name: pam_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin_pam
      MINIO_ROOT_PASSWORD: super_secret_password
    command: server /data --console-address ":9001"
    networks:
      - pam_backend

  audit_worker:
    build: 
      context: ./audit_worker
    container_name: pam_audit_worker
    environment:
      MINIO_URL: minio:9000
      MINIO_ACCESS_KEY: admin_pam
      MINIO_SECRET_KEY: super_secret_password
      MINIO_BUCKET_NAME: pam-audit-logs
      CONTROL_PLANE_API: http://control-plane-backend:8000/audit
      GUAC_LOGS_DIR: /logs
    volumes:
      - ./recordings:/logs
    depends_on:
      - minio
      - control-plane-backend
    networks:
      - pam_backend

networks:
  pam_frontend:
    driver: bridge
  pam_backend:
    driver: bridge
  pam_targets:
    driver: bridge

volumes:
  postgres_data:
